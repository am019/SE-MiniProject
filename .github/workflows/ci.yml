name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install CPU-only torch, then dev requirements
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/dev.txt
      - name: Unit tests and repository checks
        run: pytest -m "not integration and not slow" -q

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install CPU-only torch, then dev requirements
        run: |
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements/dev.txt
      - name: Integration tests (real multi-process platform)
        run: pytest -m integration -q

  docker:
    name: Docker build and compose smoke test
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Create .env with random secrets
        run: python scripts/init_env.py
      - name: Validate compose file
        run: docker compose config -q
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: End-to-end smoke test through the gateway
        run: |
          set -a; . ./.env; set +a
          pip install httpx==0.28.1
          python scripts/smoke.py --base http://127.0.0.1:${IFAP_PORT:-8080} --password "$IFAP_ADMIN_PASSWORD"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
